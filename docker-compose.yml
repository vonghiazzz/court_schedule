version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env  
    environment:
      - APP_ENV=production
      # - APP_ENV=local
    depends_on:
      - db
    ports:
      - "8001:8000"

  db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=court_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # Nginx không có service nào phụ thuộc vào, nó sẽ gặp lỗi
  # Cần thêm `depends_on`
 
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  nginx-local:
    image: nginx:alpine
    container_name: nginx_local
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
