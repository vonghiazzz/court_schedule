upstream backend_local {
    server host.docker.internal:8001;
}

upstream frontend_local {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        # Cắt bỏ tiền tố /api khi chuyển tiếp sang backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Hỗ trợ WebSockets cho chế độ React Hot-Reload / HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
